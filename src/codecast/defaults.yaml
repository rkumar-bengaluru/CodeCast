llm:
  provider: anthropic
  model: claude-sonnet-5-5
  api_key_env: ANTHROPIC_API_KEY
  base_url: null
  temperature: 0.3
  max_tokens: 4096
  timeout_s: 120
  extended_thinking: false
  caps: {}

agent:
  max_steps: 35
  max_total_tokens: 600000
  wall_clock_s: 180
  revision_steps: 15

voice:
  piper_voice: en_US-lessac-medium
  voices_dir: ~/.cache/codecast/voices
  say_voice: Samantha
  edge_voice: en-US-AriaNeural
  gap_s: 0.15
  tail_s: 0.5

# Overridable per run with CODECAST_DURATION_MIN_S / _MAX_S, CODECAST_MIN_WORDS / _MAX_WORDS / _TARGET_WORDS,
# CODECAST_MIN_SCENES / _MAX_SCENES.
limits:
  duration_min_s: 50.0
  duration_max_s: 300.0
  min_words: 110
  max_words: 200
  target_words: 155
  min_scenes: 4
  max_scenes: 10

render:
  terminal_output_allowlist: ["*.log", "*.txt", "*.out", "logs/**", "**/output*"]

pricing:
  gpt-5.4-mini:
    input_per_mtok: 0.75
    output_per_mtok: 4.50
    cache_read_per_mtok: 0.075
    cache_write_per_mtok: 0.75
  claude-sonnet-5-5:
    input_per_mtok: 3.0
    output_per_mtok: 15.0
    cache_read_per_mtok: 0.30
    cache_write_per_mtok: 3.75